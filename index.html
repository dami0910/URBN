<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PUNTO URBN - Login</title>
    <link rel="stylesheet" href="css/estilos.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" href="img/favicon.png" type="image/png">
</head>
<body class="login-page">
    <div class="login-container">
        <div class="logo">
            <img src="img/logo_URBN.png" alt="URBN Logo" width="120" class="pulse">
            <h1>PUNTO URBN</h1>
            <p>Sistema de Gestión Empresarial</p>
        </div>
        <div class="login-form">
            <h2>Iniciar Sesión</h2>
            <form id="loginForm">
                <div class="form-group">
                    <label for="username">Usuario</label>
                    <input type="text" id="username" name="username" required autocomplete="username" placeholder="Ingresa tu nombre de usuario">
                </div>
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="Ingresa tu contraseña">
                </div>
                <div class="form-group">
                    <button type="submit" class="btn btn-primary btn-block">Ingresar <span class="btn-icon">→</span></button>
                </div>
                <div id="loginMessage" class="message"></div>
            </form>
        </div>
    </div>
    <script src="js/auth.js"></script>
</body>
</html>
