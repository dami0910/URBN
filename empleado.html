<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PUNTO URBN - Punto de Venta</title>
    <link rel="stylesheet" href="css/estilos.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" href="img/logo_URBN.png" type="image/png">
    <!-- Add import map for ES modules -->
    <script type="importmap">
    {
      "imports": {
        "./employee/products.js": "./js/employee/products.js",
        "./employee/cart.js": "./js/employee/cart.js",
        "./employee/checkout.js": "./js/employee/checkout.js",
        "./employee/ui.js": "./js/employee/ui.js"
      }
    }
    </script>
</head>
<body class="empleado-page">
    <header>
        <div class="logo">
            <img src="img/logo_URBN.png" alt="URBN Logo" width="40">
            <h1>PUNTO URBN</h1>
        </div>
        <div class="user-info">
            <div class="user-badge">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                    <circle cx="12" cy="7" r="4"></circle>
                </svg>
                <span id="currentUser">Empleado</span>
            </div>
            <a href="#" id="logout" class="logout-btn">
                <span>Cerrar Sesión</span>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                    <polyline points="16 17 21 12 16 7"></polyline>
                    <line x1="21" y1="12" x2="9" y2="12"></line>
                </svg>
            </a>
        </div>
    </header>

    <main class="pos-layout">
        <div class="product-section">
            <div class="categories">
                <button class="category-btn active" data-category="all">Todos</button>
                <button class="category-btn" data-category="cafe">Café</button>
                <button class="category-btn" data-category="comida">Comida</button>
                <button class="category-btn" data-category="postre">Postre</button>
            </div>
            <div class="products-grid" id="productsGrid">
                <div class="loading-indicator">
                    <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"></circle>
                        <line x1="12" y1="6" x2="12" y2="12"></line>
                        <line x1="12" y1="12" x2="16" y2="16"></line>
                    </svg>
                    <p>Cargando productos...</p>
                </div>
            </div>
        </div>
        <div class="cart-section">
            <h2>Orden Actual</h2>
            <div class="cart-items" id="cartItems">
                <!-- Los items del carrito se cargarán dinámicamente -->
                <div class="empty-cart">
                    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <circle cx="9" cy="21" r="1"></circle>
                        <circle cx="20" cy="21" r="1"></circle>
                        <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                    </svg>
                    <p>No hay productos en el carrito</p>
                    <small>Selecciona productos para comenzar</small>
                </div>
            </div>
            <div class="cart-summary">
                <div class="summary-row">
                    <span>Subtotal:</span>
                    <span id="subtotal">$0.00</span>
                </div>
                <div class="summary-row">
                    <span>IVA (16%):</span>
                    <span id="iva">$0.00</span>
                </div>
                <div class="summary-row total">
                    <span>Total:</span>
                    <span id="total">$0.00</span>
                </div>
                <button id="checkoutBtn" class="btn btn-primary btn-block">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="12" y1="1" x2="12" y2="23"></line>
                        <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>
                    </svg>
                    Procesar Orden
                </button>
                <button id="cancelOrderBtn" class="btn btn-secondary btn-block">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"></circle>
                        <line x1="15" y1="9" x2="9" y2="15"></line>
                        <line x1="9" y1="9" x2="15" y2="15"></line>
                    </svg>
                    Cancelar
                </button>
            </div>
        </div>
    </main>

    <!-- Modal de confirmación de orden -->
    <div id="checkoutModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Finalizar Venta</h2>
            <div class="checkout-summary">
                <div id="checkoutItems"></div>
                <div class="total-amount">
                    <strong>Total a pagar: </strong>
                    <span id="checkoutTotal">$0.00</span>
                </div>
            </div>
            <form id="checkoutForm">
                <div class="form-group">
                    <label for="paymentMethod">Método de pago:</label>
                    <select id="paymentMethod" required>
                        <option value="efectivo">Efectivo</option>
                        <option value="tarjeta">Tarjeta</option>
                    </select>
                </div>
                <div id="cashPaymentSection">
                    <div class="form-group">
                        <label for="cashAmount">Monto recibido:</label>
                        <input type="number" id="cashAmount" step="0.01" min="0">
                    </div>
                    <div class="form-group">
                        <label for="cashChange">Cambio:</label>
                        <input type="text" id="cashChange" readonly>
                    </div>
                </div>
                <div class="form-group">
                    <button type="submit" class="btn btn-primary">Confirmar Venta</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module" src="js/employee.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
